<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>민쌤영어 Vocab · Set 15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=DM+Sans:wght@400;500;600&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0B0F1A;
    --surface: #131929;
    --surface-hover: #192136;
    --accent: #7CA7EB;
    --accent-glow: rgba(124, 167, 235, 0.25);
    --accent-dim: rgba(124,167,235,0.14);
    --accent-border: rgba(124,167,235,0.28);
    --text: #F0EEE8;
    --text-muted: rgba(240,238,232,0.55);
    --text-dim: rgba(240,238,232,0.25);

    /* 학습 상태 컬러 */
    --know: #5FCB8B;
    --know-dim: rgba(95,203,139,0.14);
    --know-border: rgba(95,203,139,0.42);
    --review: #F0A24B;
    --review-dim: rgba(240,162,75,0.14);
    --review-border: rgba(240,162,75,0.45);

    /* 카드 뒷면 프리미엄 라이트 테마 변수 */
    --back-bg: #F7F5F0;
    --back-text: #111111;
    --back-muted: #555555;
    --back-rule: rgba(0,0,0,0.08);
    --back-ex-bg: rgba(11,15,26,0.04);

    --radius: 22px;
    --card-w: 400px;
    --card-h: 560px;

    /* 폰트 스택 최적화 */
    --font-ko: 'Pretendard', 'Malgun Gothic', sans-serif;
  }

  body {
    background: var(--bg);
    background: radial-gradient(circle at top center, #161f36 0%, var(--bg) 70%);
    color: var(--text);
    font-family: 'DM Sans', var(--font-ko);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ── */
  header {
    width: 100%;
    max-width: 900px;
    padding: 2.2rem 2rem 1.1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 1.3rem;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .home-btn {
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-muted);
    font-size: 11px; font-weight: 600;
    padding: 6px 14px; border-radius: 99px;
    text-decoration: none; transition: all 0.2s ease; letter-spacing: 0.04em;
  }
  .home-btn:hover { background: var(--text); color: var(--bg); border-color: var(--text); }
  .brand { font-size: 14px; letter-spacing: 0.14em; color: var(--accent); font-weight: 600; text-transform: uppercase; }
  .set-label { font-size: 13px; color: var(--text-muted); font-weight: 500; }

  /* ── TOOLBAR ── */
  .toolbar {
    width: 100%;
    max-width: 640px;
    padding: 0 1rem;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 1.1rem;
  }
  .tool-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-muted);
    font-family: 'DM Sans', var(--font-ko);
    font-size: 12px; font-weight: 600;
    padding: 8px 15px; border-radius: 99px;
    cursor: pointer; transition: all 0.18s ease; letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .tool-btn:hover { background: rgba(255,255,255,0.09); color: var(--text); border-color: rgba(255,255,255,0.22); }
  .tool-btn.active {
    background: var(--accent-dim); border-color: var(--accent); color: var(--accent);
    box-shadow: 0 0 14px rgba(124,167,235,0.18);
  }
  .tool-btn.playing { background: rgba(240,162,75,0.16); border-color: var(--review); color: var(--review); }
  .tool-sep { width: 1px; height: 20px; background: rgba(255,255,255,0.1); margin: 0 2px; }
  .speed-select {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-muted);
    font-family: 'DM Sans', var(--font-ko);
    font-size: 12px; font-weight: 600;
    padding: 8px 10px; border-radius: 99px; cursor: pointer; outline: none;
  }
  .speed-select option { background: var(--surface); color: var(--text); }

  /* ── PROGRESS ── */
  .progress-wrap {
    width: 100%; max-width: 400px; margin-bottom: 1.4rem; padding: 0 1rem;
    display: flex; flex-direction: column; align-items: center; gap: 9px;
  }
  .progress-bar-bg { width: 100%; height: 4px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; }
  .progress-bar-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), #a0c4ff);
    border-radius: 99px; transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .progress-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .progress-text { font-size: 12px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.08em; }
  .stat-pill { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--text-dim); }
  .stat-pill b { font-weight: 700; }
  .stat-know b { color: var(--know); }
  .stat-review b { color: var(--review); }

  /* ── CARD STAGE ── */
  .stage {
    width: var(--card-w); height: var(--card-h);
    perspective: 2000px; cursor: pointer; outline: none;
    margin-bottom: 0.5rem;
    touch-action: pan-y;
    position: relative;
  }
  .card {
    width: 100%; height: 100%; position: relative;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), 0 5px 15px rgba(0, 0, 0, 0.2);
    border-radius: var(--radius);
  }
  .stage:hover .card { box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 25px var(--accent-glow); }
  .stage:focus-visible .card { box-shadow: 0 0 0 3px var(--accent); }
  .card.flipped { transform: rotateY(180deg); }

  /* 뒤집힌 면의 클릭 차단 (Safari backface 이슈 방지) */
  .card.flipped .front { pointer-events: none; }
  .card:not(.flipped) .back { pointer-events: none; }

  .face {
    position: absolute; inset: 0; border-radius: var(--radius);
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    overflow: hidden; display: flex; flex-direction: column;
  }

  /* ── FRONT ── */
  .front { background: var(--surface); border: 1px solid rgba(255,255,255,0.08); }
  .front-topbar { display: flex; align-items: center; justify-content: space-between; padding: 22px 26px 0; gap: 10px; }
  .front-label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); font-weight: 600; }
  .pos-pill {
    font-size: 11px; color: var(--accent); background: var(--accent-dim);
    border: 1px solid var(--accent-border); padding: 4px 12px; border-radius: 99px;
    font-weight: 600; letter-spacing: 0.04em; white-space: nowrap;
  }
  .front-body {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    padding: 24px 32px; overflow-y: auto; scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.12) transparent;
  }
  .front-body::-webkit-scrollbar { width: 4px; }
  .front-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 99px; }
  .sentence { font-size: 19px; line-height: 1.8; color: rgba(240,238,232,0.92); font-weight: 400; word-break: keep-all; }
  .sentence .hw {
    font-size: calc(19px * 1.25); font-weight: 700; color: var(--accent);
    font-family: 'Playfair Display', serif; display: inline;
    border-bottom: 2px dashed var(--accent-border); padding-bottom: 2px;
  }
  .front-footer { padding: 0 24px 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .ipa-line {
    font-size: 13px; color: var(--accent); letter-spacing: 0.02em; font-weight: 500;
    font-family: 'DM Sans', sans-serif; opacity: 0.85;
  }
  .speak-row { display: flex; gap: 8px; }
  .icon-btn {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(124,167,235,0.10);
    border: 1px solid var(--accent-border);
    color: var(--accent);
    font-family: 'DM Sans', var(--font-ko);
    font-size: 11.5px; font-weight: 600;
    padding: 6px 13px; border-radius: 99px; cursor: pointer;
    transition: all 0.18s ease; letter-spacing: 0.02em; white-space: nowrap;
  }
  .icon-btn:hover { background: var(--accent); color: #0B0F1A; border-color: var(--accent); }
  .icon-btn.speaking { animation: pulse 0.9s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  .hint { font-size: 11.5px; color: var(--text-dim); text-align: center; letter-spacing: 0.05em; font-weight: 500; }
  .deco-bar { height: 4px; background: linear-gradient(90deg, var(--accent) 0%, #a0c4ff 60%, transparent 100%); }

  /* ── BACK ── */
  .back { background: var(--back-bg); transform: rotateY(180deg); }
  .back-header {
    background: #0B0F1A; padding: 20px 26px 17px;
    border-radius: var(--radius) var(--radius) 0 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .back-word-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
  .back-word {
    font-family: 'Playfair Display', serif; font-size: 33px; font-weight: 700;
    color: #ffffff; line-height: 1.1; letter-spacing: -0.02em;
  }
  .back-sub { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .back-pos { font-size: 12px; color: var(--accent); letter-spacing: 0.1em; font-weight: 600; }
  .back-ipa { font-size: 12.5px; color: rgba(240,238,232,0.5); font-family: 'DM Sans', sans-serif; }

  .back-body {
    flex: 1; padding: 18px 24px 20px;
    display: flex; flex-direction: column; gap: 14px;
    overflow-y: auto; scrollbar-width: thin;
    scrollbar-color: rgba(0, 0, 0, 0.15) transparent;
    -webkit-overflow-scrolling: touch;
  }
  .back-body::-webkit-scrollbar { width: 5px; }
  .back-body::-webkit-scrollbar-thumb { background-color: rgba(0, 0, 0, 0.15); border-radius: 99px; }

  /* 구역 분리 */
  .sec { display: flex; flex-direction: column; gap: 8px; }
  .sec + .sec { border-top: 1px solid var(--back-rule); padding-top: 13px; }
  .sec-title {
    display: flex; align-items: center; gap: 7px;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    font-weight: 700; color: #8b8f96; font-family: 'DM Sans', var(--font-ko);
  }
  .sec-title::before { content: ''; width: 3px; height: 11px; border-radius: 2px; background: #185FA5; }
  .sec-ex .sec-title::before { background: #2E8B6B; }
  .sec-deriv .sec-title::before { background: #7B5BB5; }
  .sec-syn .sec-title::before { background: #1D8FA8; }
  .sec-etym .sec-title::before { background: #C08A32; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

  .meaning-block { display: flex; flex-direction: column; gap: 3px; }
  .meaning-num { font-size: 10px; color: #185FA5; font-weight: 700; letter-spacing: 0.08em; }
  .meaning-text {
    font-size: 15.5px; color: var(--back-text); font-weight: 600; line-height: 1.5;
    word-break: keep-all; overflow-wrap: break-word; font-family: var(--font-ko);
  }

  .ex-block {
    background: var(--back-ex-bg); border-left: 4px solid var(--accent);
    border-radius: 0 10px 10px 0; padding: 13px 15px;
    display: flex; flex-direction: column; gap: 7px;
  }
  .ex-eng { font-size: 13.5px; color: #2b2b2b; line-height: 1.65; }
  .ex-eng strong { color: #185FA5; font-weight: 700; font-family: 'Playfair Display', serif; font-size: 14.5px; }
  .ex-kor { font-size: 13px; color: #000000; font-weight: 700; line-height: 1.6; font-family: var(--font-ko); word-break: keep-all; }

  .light-icon-btn {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(24,95,165,0.08); border: 1px solid rgba(24,95,165,0.22);
    color: #185FA5; font-family: 'DM Sans', var(--font-ko);
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em;
    padding: 4px 10px; border-radius: 99px; cursor: pointer; transition: all 0.18s ease;
    white-space: nowrap;
  }
  .light-icon-btn:hover { background: #185FA5; color: #fff; border-color: #185FA5; }
  .light-icon-btn.speaking { animation: pulse 0.9s ease-in-out infinite; }

  .deriv-box {
    font-size: 13px; line-height: 1.7; color: #33313a; font-family: var(--font-ko);
    background: rgba(123,91,181,0.07); border-left: 3px solid #7B5BB5;
    border-radius: 0 8px 8px 0; padding: 10px 12px; word-break: keep-all;
  }
  .syn-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
  .syn-chip {
    font-size: 12.5px; font-weight: 600; padding: 4px 11px; border-radius: 99px;
    background: rgba(29,143,168,0.08); border: 1px solid rgba(29,143,168,0.24);
    color: #146074; font-family: 'DM Sans', sans-serif;
  }
  .etym-box {
    font-size: 12.8px; line-height: 1.75; color: #3a3630; font-family: var(--font-ko);
    background: rgba(192,138,50,0.08); border-left: 3px solid #C08A32;
    border-radius: 0 8px 8px 0; padding: 10px 12px; word-break: keep-all;
  }
  .back-deco { height: 4px; background: linear-gradient(90deg, transparent 0%, rgba(124,167,235,0.4) 40%, var(--accent) 100%); }

  /* ── EMPTY STATE ── */
  .empty-state {
    position: absolute; inset: 0; border-radius: var(--radius);
    background: var(--surface); border: 1px dashed rgba(255,255,255,0.14);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; padding: 30px; z-index: 5;
  }
  .empty-state.show { display: flex; }
  .empty-emoji { font-size: 34px; }
  .empty-title { font-size: 15px; font-weight: 700; color: var(--text); font-family: var(--font-ko); }
  .empty-desc { font-size: 12.5px; color: var(--text-muted); line-height: 1.7; font-family: var(--font-ko); word-break: keep-all; }

  /* ── STATUS BAR ── */
  .status-bar { display: flex; gap: 10px; margin-top: 1.1rem; width: var(--card-w); padding: 0 2px; }
  .st-btn {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-muted); font-family: 'DM Sans', var(--font-ko);
    font-size: 13px; font-weight: 600; padding: 11px 0; border-radius: 99px;
    cursor: pointer; transition: all 0.18s ease;
  }
  .st-btn:disabled { opacity: 0.2; cursor: default; }
  .st-know:hover:not(:disabled) { border-color: var(--know-border); color: var(--know); background: var(--know-dim); }
  .st-review:hover:not(:disabled) { border-color: var(--review-border); color: var(--review); background: var(--review-dim); }
  .st-know.on { background: var(--know-dim); border-color: var(--know); color: var(--know); box-shadow: 0 0 14px rgba(95,203,139,0.16); }
  .st-review.on { background: var(--review-dim); border-color: var(--review); color: var(--review); box-shadow: 0 0 14px rgba(240,162,75,0.16); }

  /* ── NAVIGATION ── */
  .nav { display: flex; align-items: center; gap: 18px; margin-top: 1rem; }
  .nav-btn {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    color: var(--text-muted); font-family: 'DM Sans', var(--font-ko);
    font-size: 13px; font-weight: 600; padding: 11px 26px; border-radius: 99px;
    cursor: pointer; transition: all 0.2s ease; letter-spacing: 0.02em;
  }
  .nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); color: var(--text); }
  .nav-btn:disabled { opacity: 0.15; cursor: default; }
  .flip-btn {
    background: var(--accent); border: none; color: #0B0F1A;
    font-family: 'DM Sans', var(--font-ko); font-size: 14px; font-weight: 700;
    padding: 11px 36px; border-radius: 99px; cursor: pointer;
    transition: all 0.2s ease; letter-spacing: 0.04em;
    box-shadow: 0 4px 15px rgba(124, 167, 235, 0.3);
  }
  .flip-btn:hover { opacity: 0.95; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124, 167, 235, 0.4); }

  .kbd-hint {
    margin-top: 1rem; font-size: 11px; color: var(--text-dim); letter-spacing: 0.04em;
    font-family: var(--font-ko); text-align: center; padding: 0 1rem; line-height: 1.8;
  }
  .kbd-hint kbd {
    display: inline-block; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 5px; padding: 1px 6px; font-family: 'DM Sans', monospace; font-size: 10.5px;
    color: var(--text-muted); margin: 0 1px;
  }

  /* ── WORD LIST ── */
  .wordlist { width: 100%; max-width: 720px; margin-top: 2.4rem; padding: 0 1.5rem 4rem; }
  .wordlist-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .wordlist-title { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); font-weight: 600; }
  .filter-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-muted); font-family: 'DM Sans', var(--font-ko);
    font-size: 12px; font-weight: 600; padding: 6px 13px; border-radius: 99px;
    cursor: pointer; transition: all 0.18s ease; white-space: nowrap;
  }
  .tab:hover { border-color: rgba(255,255,255,0.24); color: var(--text); }
  .tab .cnt {
    font-size: 10.5px; font-weight: 700; background: rgba(255,255,255,0.08);
    border-radius: 99px; padding: 1px 7px; color: var(--text-muted);
  }
  .tab.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .tab.active .cnt { background: rgba(124,167,235,0.2); color: var(--accent); }
  .tab[data-f="review"].active { background: var(--review-dim); border-color: var(--review); color: var(--review); }
  .tab[data-f="review"].active .cnt { background: rgba(240,162,75,0.2); color: var(--review); }
  .tab[data-f="know"].active { background: var(--know-dim); border-color: var(--know); color: var(--know); }
  .tab[data-f="know"].active .cnt { background: rgba(95,203,139,0.2); color: var(--know); }

  .wordlist-grid {
    display: flex; flex-wrap: wrap; gap: 8px;
    max-height: 220px; overflow-y: auto; padding-right: 6px;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;
  }
  .wordlist-grid::-webkit-scrollbar { width: 4px; }
  .wordlist-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 99px; }

  .word-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; padding: 6px 14px; border-radius: 99px;
    border: 1px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.7);
    cursor: pointer; transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    background: transparent; font-family: 'DM Sans', sans-serif;
  }
  .word-chip:hover { border-color: rgba(124,167,235,0.4); color: var(--accent); background: rgba(124,167,235,0.05); }
  .word-chip .badge { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.16); flex: 0 0 auto; }
  .word-chip.know { border-color: var(--know-border); color: rgba(95,203,139,0.95); background: rgba(95,203,139,0.06); }
  .word-chip.know .badge { background: var(--know); box-shadow: 0 0 7px rgba(95,203,139,0.7); }
  .word-chip.review { border-color: var(--review-border); color: rgba(240,162,75,0.95); background: rgba(240,162,75,0.06); }
  .word-chip.review .badge { background: var(--review); box-shadow: 0 0 7px rgba(240,162,75,0.7); }
  .word-chip.active {
    background: var(--accent-dim); border-color: var(--accent); color: var(--accent);
    font-weight: 600; box-shadow: 0 0 12px rgba(124, 167, 235, 0.15);
  }
  .word-chip.active .badge { background: var(--accent); }
  .word-chip.know.active { background: var(--know-dim); border-color: var(--know); color: var(--know); }
  .word-chip.know.active .badge { background: var(--know); }
  .word-chip.review.active { background: var(--review-dim); border-color: var(--review); color: var(--review); }
  .word-chip.review.active .badge { background: var(--review); }
  .list-empty { font-size: 12.5px; color: var(--text-dim); font-family: var(--font-ko); padding: 10px 2px; }

/* ── UTIL ────────────────────────────────────────────────────── */
function plain(s) { return String(s || '').replace(/[{}]/g, ''); }
function currentIdx() { return state.deck.length ? state.deck[state.pos] : null; }

let toastTimer = null;
function toast(msg) {
  el.toast.textContent = msg;
  el.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.toast.classList.remove('show'), 1800);
}

/* ── TTS (Web Speech API) ────────────────────────────────────── */
const synth = window.speechSynthesis || null;
let enVoice = null;

function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices();
  if (!vs.length) return;
  enVoice =
    vs.find(v => /^en[-_]US/i.test(v.lang) && /(Google US English|Samantha|Ava|Aria|Jenny)/i.test(v.name)) ||
    vs.find(v => /^en[-_]US/i.test(v.lang)) ||
    vs.find(v => /^en[-_]GB/i.test(v.lang)) ||
    vs.find(v => /^en/i.test(v.lang)) || null;
}
if (synth) {
  pickVoice();
  synth.addEventListener('voiceschanged', pickVoice);
}

let speakingBtn = null;
function speak(text, btn, rate) {
  if (!synth) { toast('이 브라우저는 음성 합성(TTS)을 지원하지 않습니다.'); return; }
  try { synth.cancel(); } catch (e) {}
  if (speakingBtn) speakingBtn.classList.remove('speaking');
  speakingBtn = btn || null;
  if (speakingBtn) speakingBtn.classList.add('speaking');

  const u = new SpeechSynthesisUtterance(plain(text));
  u.lang = (enVoice && enVoice.lang) || 'en-US';
  if (enVoice) u.voice = enVoice;
  u.rate = rate || 0.92;
  u.pitch = 1;
  u.onend = u.onerror = () => {
    if (speakingBtn) speakingBtn.classList.remove('speaking');
    speakingBtn = null;
  };
  synth.speak(u);
}
function stopSpeak() {
  if (synth) { try { synth.cancel(); } catch (e) {} }
  if (speakingBtn) { speakingBtn.classList.remove('speaking'); speakingBtn = null; }
}
function speakWord(btn) { const d = DATA[currentIdx()]; if (d) speak(d.word, btn, 0.85); }
function speakSentence(btn) { const d = DATA[currentIdx()]; if (d) speak(d.sentence, btn, 0.92); }
function speakBoth() {
  const d = DATA[currentIdx()]; if (!d) return;
  speak(d.word + '. ' + plain(d.sentence), null, 0.92);
}

/* ── DECK ────────────────────────────────────────────────────── */
function matchFilter(i) {
  const s = state.status[i];
  if (state.filter === 'all') return true;
  if (state.filter === 'review') return s === 'review';
  if (state.filter === 'know') return s === 'know';
  return true;
}
function baseOrder() { return state.seed ? state.seed.slice() : DATA.map((_, i) => i); }

function buildDeck(keepIdx) {
  const prevIdx = (keepIdx !== undefined) ? keepIdx : currentIdx();
  state.deck = baseOrder().filter(matchFilter);
  const at = state.deck.indexOf(prevIdx);
  if (at >= 0) state.pos = at;
  else state.pos = Math.min(state.pos, Math.max(0, state.deck.length - 1));
}

/* ── RENDER ──────────────────────────────────────────────────── */
function renderSentence(t) { return t.replace(/\{([^}]+)\}/g, '<span class="hw">$1</span>'); }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function renderCard() {
  const idx = currentIdx();
  const has = idx !== null;
  el.empty.classList.toggle('show', !has);
  el.stage.style.visibility = 'visible';

  if (!has) {
    el.progressText.textContent = '0 / 0';
    el.progressFill.style.width = '0%';
    el.btnPrev.disabled = el.btnNext.disabled = true;
    el.btnKnow.disabled = el.btnReview.disabled = true;
    el.btnKnow.classList.remove('on'); el.btnReview.classList.remove('on');
    el.emptyTitle.textContent = state.filter === 'review'
      ? '"모르겠어요"로 표시한 단어가 없습니다' : (state.filter === 'know' ? '아직 암기 완료한 단어가 없습니다' : '표시할 단어가 없습니다');
    el.emptyDesc.textContent = '필터를 \u2018전체보기\u2019로 바꾸거나 카드를 분류해 보세요.';
    setFlip(false);
    renderChips();
    return;
  }

  const d = DATA[idx];
  el.fPos.textContent = d.pos;
  el.fSentence.innerHTML = renderSentence(d.sentence);
  el.fIpa.textContent = d.pronun || '';
  el.bWord.textContent = d.word;
  el.bPos.textContent = d.pos;
  el.bIpa.textContent = d.pronun || '';

  /* 뒷면 구역 조립: 의미 → 예문 → 파생어 → 유의어 → 어근 */
  let html = '';

  html += '<div class="sec sec-mean"><div class="sec-title">의미 · Meaning</div>';
  d.meanings.forEach(m => {
    html += `<div class="meaning-block"><span class="meaning-num">${esc(m.num)} 의미</span><span class="meaning-text">${esc(m.text)}</span></div>`;
  });
  html += '</div>';

  const exEng = esc(d.sentence).replace(/\{([^}]+)\}/g, '<strong>$1</strong>');
  html += '<div class="sec sec-ex">'
       +  '<div class="sec-head"><div class="sec-title">예문 · Example</div>'
       +  '<button class="light-icon-btn" data-act="speak-ex" type="button">🔊 예문 듣기</button></div>'
       +  `<div class="ex-block"><p class="ex-eng">${exEng}</p><p class="ex-kor">${esc(d.translation)}</p></div>`
       +  '</div>';

  if (d.deriv) {
    html += '<div class="sec sec-deriv"><div class="sec-title">파생어 · Word Family</div>'
         +  `<div class="deriv-box">${esc(d.deriv)}</div></div>`;
  }
  if (d.syn && d.syn.length) {
    html += '<div class="sec sec-syn"><div class="sec-title">유의어 · Synonyms</div><div class="syn-wrap">'
         +  d.syn.map(s => `<span class="syn-chip">${esc(s)}</span>`).join('')
         +  '</div></div>';
  }
  if (d.etym) {
    html += '<div class="sec sec-etym"><div class="sec-title">어근 · Etymology</div>'
         +  `<div class="etym-box">${esc(d.etym)}</div></div>`;
  }

  el.bBody.innerHTML = html;
  el.bBody.scrollTop = 0;

  const total = state.deck.length;
  el.progressFill.style.width = ((state.pos + 1) / total * 100) + '%';
  el.progressText.textContent = `${state.pos + 1} / ${total}`;
  el.btnPrev.disabled = state.pos === 0;
  el.btnNext.disabled = state.pos === total - 1;
  el.btnKnow.disabled = el.btnReview.disabled = false;
  el.btnKnow.classList.toggle('on', state.status[idx] === 'know');
  el.btnReview.classList.toggle('on', state.status[idx] === 'review');

  setFlip(false);
  renderChips();
  updateStats();
}

function renderChips() {
  const cur = currentIdx();
  el.grid.innerHTML = '';
  if (!state.deck.length) {
    el.grid.innerHTML = '<div class="list-empty">조건에 맞는 단어가 없습니다.</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  state.deck.forEach((di, p) => {
    const d = DATA[di];
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'word-chip'
      + (state.status[di] ? ' ' + state.status[di] : '')
      + (di === cur ? ' active' : '');
    b.innerHTML = '<span class="badge"></span>' + esc(d.word);
    b.onclick = () => { stopAuto(); state.pos = p; renderCard(); };
    frag.appendChild(b);
  });
  el.grid.appendChild(frag);
  const active = el.grid.querySelector('.word-chip.active');
  if (active) active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
}

function updateStats() {
  let k = 0, r = 0;
  DATA.forEach((_, i) => {
    if (state.status[i] === 'know') k++;
    else if (state.status[i] === 'review') r++;
  });
  el.statKnow.textContent = k;
  el.statReview.textContent = r;
  el.statNone.textContent = DATA.length - k - r;
  el.cntAll.textContent = DATA.length;
  el.cntKnow.textContent = k;
  el.cntReview.textContent = r;
}

/* ── FLIP / NAV ──────────────────────────────────────────────── */
function setFlip(on) { el.card.classList.toggle('flipped', !!on); }
function isFlipped() { return el.card.classList.contains('flipped'); }
function flip() {
  if (!state.deck.length) return;
  setFlip(!isFlipped());
  if (state.autoSpeak) {
    if (isFlipped()) speakWord(null); else speakSentence(null);
  }
}
function go(dir) {
  if (!state.deck.length) return;
  const next = state.pos + dir;
  if (next < 0 || next >= state.deck.length) return;
  state.pos = next;
  stopSpeak();
  renderCard();
  if (state.autoSpeak) speakSentence(null);
}

/* ── 학습 상태 분류 ──────────────────────────────────────────── */
function mark(kind) {
  const idx = currentIdx();
  if (idx === null) return;
  const off = state.status[idx] === kind;
  if (off) delete state.status[idx]; else state.status[idx] = kind;

  if (state.filter !== 'all') {
    const keepPos = state.pos;
    buildDeck(null);
    state.pos = Math.min(keepPos, Math.max(0, state.deck.length - 1));
    renderCard();
    updateStats();
  } else {
    updateStats();
    el.btnKnow.classList.toggle('on', state.status[idx] === 'know');
    el.btnReview.classList.toggle('on', state.status[idx] === 'review');
    renderChips();
    if (!off && state.pos < state.deck.length - 1 && !state.autoplay) {
      setTimeout(() => go(1), 240);
    }
  }
}

/* ── 셔플 ────────────────────────────────────────────────────── */
function shuffleDeck() {
  const arr = DATA.map((_, i) => i);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  state.seed = arr;
  state.pos = 0;
  buildDeck(null);
  state.pos = 0;
  el.btnShuffle.classList.add('active');
  el.btnShuffle.textContent = '↩︎ 원래 순서';
  renderCard();
  toast('단어 순서를 무작위로 섞었습니다.');
}
function unshuffleDeck() {
  const keep = currentIdx();
  state.seed = null;
  buildDeck(keep);
  el.btnShuffle.classList.remove('active');
  el.btnShuffle.textContent = '🔀 셔플';
  renderCard();
  toast('원래 순서로 되돌렸습니다.');
}

/* ── 자동 재생 ───────────────────────────────────────────────── */
let apTimer = null, apPhase = 0;
function autoTick() {
  if (!state.deck.length) { stopAuto(); return; }
  if (apPhase === 0) {
    setFlip(true);
    if (state.autoSpeak) speakWord(null);
    apPhase = 1;
  } else {
    if (state.pos >= state.deck.length - 1) {
      stopAuto();
      toast('마지막 카드입니다. 자동재생을 종료합니다.');
      return;
    }
    state.pos++;
    renderCard();
    if (state.autoSpeak) speakSentence(null);
    apPhase = 0;
  }
}
function startAuto() {
  if (!state.deck.length) { toast('재생할 카드가 없습니다.'); return; }
  state.autoplay = true;
  apPhase = 0;
  el.btnAuto.classList.add('playing');
  el.btnAuto.textContent = '⏸ 정지';
  if (state.autoSpeak) speakSentence(null);
  clearInterval(apTimer);
  apTimer = setInterval(autoTick, state.speed);
  toast(`자동재생 시작 · ${state.speed / 1000}초 간격`);
}
function stopAuto() {
  if (!state.autoplay) return;
  state.autoplay = false;
  clearInterval(apTimer); apTimer = null;
  el.btnAuto.classList.remove('playing');
  el.btnAuto.textContent = '▶ 자동재생';
  stopSpeak();
}
function toggleAuto() { state.autoplay ? stopAuto() : startAuto(); }

/* ── 이벤트 바인딩 ───────────────────────────────────────────── */
let suppressClick = false;

el.stage.addEventListener('click', e => {
  if (suppressClick) return;
  if (e.target.closest('button')) return;   // 카드 내부 버튼은 뒤집기 제외
  stopAuto();
  flip();
});

/* 카드 내부 스피커 버튼 */
$('fSpeakWord').addEventListener('click', e => { e.stopPropagation(); stopAuto(); speakWord(e.currentTarget); });
$('fSpeakSent').addEventListener('click', e => { e.stopPropagation(); stopAuto(); speakSentence(e.currentTarget); });
$('bSpeakWord').addEventListener('click', e => { e.stopPropagation(); stopAuto(); speakWord(e.currentTarget); });
el.bBody.addEventListener('click', e => {
  const b = e.target.closest('[data-act="speak-ex"]');
  if (!b) return;
  e.stopPropagation(); stopAuto(); speakSentence(b);
});

el.btnPrev.addEventListener('click', () => { stopAuto(); go(-1); });
el.btnNext.addEventListener('click', () => { stopAuto(); go(1); });
el.btnFlip.addEventListener('click', () => { stopAuto(); flip(); });
el.btnKnow.addEventListener('click', () => { stopAuto(); mark('know'); });
el.btnReview.addEventListener('click', () => { stopAuto(); mark('review'); });
el.btnShuffle.addEventListener('click', () => { stopAuto(); state.seed ? unshuffleDeck() : shuffleDeck(); });
el.btnAuto.addEventListener('click', toggleAuto);
el.btnAutoSpeak.addEventListener('click', () => {
  state.autoSpeak = !state.autoSpeak;
  el.btnAutoSpeak.classList.toggle('active', state.autoSpeak);
  toast(state.autoSpeak ? '자동 발음 ON' : '자동 발음 OFF');
  if (!state.autoSpeak) stopSpeak();
});
el.selSpeed.addEventListener('change', e => {
  state.speed = parseInt(e.target.value, 10);
  if (state.autoplay) { clearInterval(apTimer); apTimer = setInterval(autoTick, state.speed); }
  toast(`자동재생 간격 ${state.speed / 1000}초`);
});
el.btnReset.addEventListener('click', () => {
  if (!Object.keys(state.status).length) { toast('초기화할 학습 기록이 없습니다.'); return; }
  if (!confirm('알아요 / 모르겠어요 분류를 모두 지울까요?')) return;
  stopAuto();
  state.status = {};
  state.filter = 'all';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.f === 'all'));
  buildDeck(null);
  renderCard();
  toast('학습 상태를 초기화했습니다.');
});

/* 필터 탭 */
$('filterTabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (!t) return;
  stopAuto();
  state.filter = t.dataset.f;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
  const keep = currentIdx();
  buildDeck(matchFilter(keep) ? keep : null);
  if (!matchFilter(keep)) state.pos = 0;
  renderCard();
});

/* 키보드 */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toUpperCase();
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  const k = e.key.toLowerCase();
  if (e.key === 'ArrowRight') { stopAuto(); go(1); }
  else if (e.key === 'ArrowLeft') { stopAuto(); go(-1); }
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); stopAuto(); flip(); }
  else if (k === 'k') { stopAuto(); mark('know'); }
  else if (k === 'j' || k === 'r') { stopAuto(); mark('review'); }
  else if (k === 'v') { stopAuto(); isFlipped() ? speakWord(null) : speakSentence(null); }
  else if (k === 's') { stopAuto(); state.seed ? unshuffleDeck() : shuffleDeck(); }
  else if (k === 'p') { e.preventDefault(); toggleAuto(); }
});

/* 터치 스와이프: 좌우 = 이전/다음, 상하 = 뒤집기 */
let tx = 0, ty = 0, tt = 0, fromScroll = false;
el.stage.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];
  tx = t.clientX; ty = t.clientY; tt = Date.now();
  const sc = e.target.closest('.back-body, .front-body');
  fromScroll = !!(sc && sc.scrollHeight > sc.clientHeight + 4);
}, { passive: true });

el.stage.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const dx = t.clientX - tx, dy = t.clientY - ty, dt = Date.now() - tt;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  if (dt > 900) return;
  if (ax < 45 && ay < 45) return;            // 탭으로 처리 → click 핸들러가 뒤집음
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 450);
  stopAuto();
  if (ax > ay * 1.2) { dx < 0 ? go(1) : go(-1); }
  else if (!fromScroll && ay > 55) { flip(); }
}, { passive: true });

/* ── INIT ────────────────────────────────────────────────────── */
buildDeck(null);
renderCard();
updateStats();
</script>
</body>
</html>
